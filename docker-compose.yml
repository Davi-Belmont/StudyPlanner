services:
  postgres:
    image: postgres:16
    container_name: studyplanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studyplanner
    ports:
      - "5432:5432"
    volumes:
      - studyplanner_data:/var/lib/postgresql/data

volumes:
  studyplanner_data: